name: Import MT Kitap source

on:

  workflow_dispatch:
  
  push:
  
    branches: [main]
    
permissions:

  contents: write
  
jobs:

  import-source:
  
    if: hashFiles('mtkitap-source.zip') != ''
    
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Unpack project source
      
        run: |
        
          mkdir -p /tmp/mtkitap-source
          
          unzip -oq mtkitap-source.zip -d /tmp/mtkitap-source
          
          rsync -a --delete --exclude='.git' --exclude='mtkitap-source.zip' /tmp/mtkitap-source/ ./
          
          rm -f mtkitap-source.zip
          
      - name: Commit imported source
      
        run: |
        
          git config user.name 'github-actions[bot]'
          
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          git add -A
          
          git diff --cached --quiet && exit 0
          
          git commit -m 'Import MT Kitap source'
          
          git push
          























